worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;
        # Static-server liveness only; not API or DB readiness.
        location = /healthz {
            default_type text/plain;
            alias /usr/share/nginx/healthz;
        }
        # Keep /api, query strings, browser Origin and session cookies.
        # Refresh DNS after API recreation instead of keeping its old IP.
        location ~ ^/api(?:/|$) {
            # Match Spring multipart max-request-size=11MB, not max-file-size=10MB.
            # Spring MB and Nginx m are binary: 11 * 1024 * 1024 = 11534336 bytes.
            # Whole-request limit includes multipart framing; Spring checks each file.
            client_max_body_size 11m;
            set $api_upstream api:8080;
            proxy_pass http://$api_upstream$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Origin $http_origin;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_intercept_errors off;
        }
        location /assets/ { try_files $uri =404; }
        location ~ /\. { return 404; }
        location / { try_files $uri $uri/ /index.html; }
    }
}
